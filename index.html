<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>What AI & Data Science Major Are You?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    
    <!-- Start Screen -->
  <div id="startScreen">
    <h1>What AI & Data Science Major Are You?</h1>
  
    <p>
      Answer 15 questions to discover which AI & Data Science major
      best matches your interests and strengths.
    </p>
  
    <button onclick="startQuiz()">
      Start Quiz
    </button>
  </div>
  
  <!-- Quiz -->
  <div id="quiz" class="hidden">
    <h2 id="question"></h2>
    <div id="answers"></div>
  
    <div class="progress-container">
      <div id="progressBar"></div>
    </div>
  
    <p id="progressText"></p>
  </div>
    
  <!-- Results -->
  <div id="result" class="hidden">
    <h2>Your Result</h2>
  
    <div id="resultText"></div>
  
    <a
      href="https://datascience.byu.edu/degrees"
      target="_blank"
      class="majors-link"
    >
      Read more about the different Data Science majors here
    </a>

    <a
      href="https://science.byu.edu/advisement"
      target="_blank"
      class="majors-link"
    >
      Click here to meet with an advisor to learn more about your major options
    </a>
  
    <button onclick="restartQuiz()">
      Restart Quiz
    </button>
  </div>


  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
